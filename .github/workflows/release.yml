name: release

# Push a tag like v0.1.0 to publish to npm and move the floating v0 tag used by the Action.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write # npm Trusted Publishing (OIDC) and provenance; no npm token needed

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm 11, which Trusted Publishing requires (>= 11.5.1)
          # No registry-url: it makes setup-node inject a placeholder NODE_AUTH_TOKEN,
          # which npm then uses instead of the OIDC Trusted Publishing exchange.
          cache: npm
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - name: Check tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm publish --access public
      - name: Move major tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major"
          git push -f origin "$major"
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
